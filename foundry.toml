[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
auto_detect_remappings = false
remappings = [
    "v4-core/=lib/v4-core/",
    "v4-periphery/=lib/v4-periphery/",
    "@uniswap/v4-core/=lib/v4-core/",
    "@openzeppelin/contracts/=lib/v4-core/lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
    "solmate/=lib/v4-core/lib/solmate/",
    "reactive-lib/=lib/reactive-lib/src/",
    "reactive-test-lib/=lib/reactive-test-lib/src/",
]

[profile.fast]
src = "src"
out = "out/fast"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = false
via_ir = false
auto_detect_remappings = false
remappings = [
    "v4-core/=lib/v4-core/",
    "v4-periphery/=lib/v4-periphery/",
    "@uniswap/v4-core/=lib/v4-core/",
    "@openzeppelin/contracts/=lib/v4-core/lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
    "solmate/=lib/v4-core/lib/solmate/",
    "reactive-lib/=lib/reactive-lib/src/",
    "reactive-test-lib/=lib/reactive-test-lib/src/",
]

[profile.ci]
src = "src"
out = "out/ci"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
auto_detect_remappings = false
remappings = [
    "v4-core/=lib/v4-core/",
    "v4-periphery/=lib/v4-periphery/",
    "@uniswap/v4-core/=lib/v4-core/",
    "@openzeppelin/contracts/=lib/v4-core/lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
    "solmate/=lib/v4-core/lib/solmate/",
    "reactive-lib/=lib/reactive-lib/src/",
    "reactive-test-lib/=lib/reactive-test-lib/src/",
]

[rpc_endpoints]
unichain_sepolia = "${UNICHAIN_SEPOLIA_RPC}"
unichain = "${UNICHAIN_RPC}"

[etherscan]
unichain-sepolia = { key = "${UNISCAN_API_KEY}", chain = 1301, url = "https://api.uniscan.xyz/api" }

[fuzz]
runs = 1000
seed = "0x1"

[invariant]
runs = 256
depth = 15

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
